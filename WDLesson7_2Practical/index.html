<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>7.2 Prac Collisions(map)</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Your CSS -->
  <link href="style.css" rel="stylesheet" type="text/css" />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Your JS files -->
  <script src="helper.js"></script>
  <script src="script.js"></script>
</head>

<body onload="init()">

  <div id="banner" class="container center">
    <h1>Motor Vehicle Collisions - with Maps</h1>
  </div>

  <div class="container subbanner">
    <p>
      This practical challenges students to display accident information
      retrieved from the
      <a href="https://data.cityofnewyork.us/Public-Safety/Motor-Vehicle-Collisions-Crashes/h9gi-nx95"
        target="_blank">
        Motor Vehicle Collision
      </a>
      dataset at NYC Open Data.
    </p>
  </div>

  <div>
    <input type="text" id="car" placeholder="Enter borough">
    <a class="button" onclick="filterByBoro()">Search by Borough</a>
  </div>

  <div id="output" class="container">
    <div id="leftPanel" class="container"></div>
    <div id="map" style="height:500px;"></div>
  </div>

  <div id="footer" class="container center">
    <h3>Lesson 7.2 Prac - Collisions(Map)</h3>
  </div>

</body>

</html>
